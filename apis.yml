apis:
  - aid: hexagon-manufacturing-intelligence:pc-dmis-api
    name: PC-DMIS API
    description: >-
      The PC-DMIS API provides programmatic control over Hexagon CMM (coordinate
      measuring machine) measurement software, enabling automation of measurement
      programs, results extraction, and integration with quality management systems.
      Supports COM/ActiveX interfaces and JavaScript-based scripting for custom
      measurement application development.
