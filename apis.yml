name: Hexagon Manufacturing Intelligence
description: >-
  Hexagon Manufacturing Intelligence is a division of Hexagon AB providing metrology,
  quality management, and manufacturing intelligence software and hardware. Products
  include PC-DMIS (CMM measurement software), WORKXPLORE (CAD viewer), SFx (smart
  factory platform), and HxGN Smart Quality. The division offers APIs and SDKs for
  automating CMM measurement programs, integrating quality data into MES and ERP
  systems, and building custom metrology applications.
